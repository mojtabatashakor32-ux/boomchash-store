<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جستجوی اعضا | بوم چاش (boomchash.ir)</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, 'Vazirmatn', sans-serif; }
    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f5;
      color: #1f2937;
      line-height: 1.6;
    }
    .container {
      max-width: 1180px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 20px; color: #111827; }
    .sub-muted { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 760px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .field-wrap { display: flex; flex-direction: column; }
    label {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #1f2937;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      background: #fff;
      color: #111827;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #15803d;
    }
    .btn-secondary {
      background: #475569;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #334155; }
    .search-panel {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .adv-box {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
      display: none;
    }
    .adv-box.open { display: block; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 9px 10px;
      text-align: right;
      vertical-align: top;
      white-space: nowrap;
    }
    th {
      background: #f1f5f9;
      font-weight: bold;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="top-bar">
        <div>
          <h1>جستجو و فهرست کاربران ثبت‌شده | بوم چاش</h1>
          <div class="sub-muted">جستجوی دقیق بر اساس اطلاعات یکتا یا جستجوی پیشرفته بر اساس ویژگی‌های عمومی</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="btn-secondary" onclick="toggleAdvancedSearch()">⚙️ جستجوی پیشرفته</button>
          <button type="button" class="btn-secondary" onclick="resetFilters()">پاک‌سازی فیلترها</button>
          <button type="button" class="btn-secondary" onclick="renderMembersTable()">به‌روزرسانی (<span id="totalBadge">0</span>)</button>
        </div>
      </div>

      <div class="search-panel">
        <label for="uniqueSearchInput">🔎 جستجو با شناسه یکتا (کد ملی، شماره موبایل، نام کاربری یا ایمیل)</label>
        <input
          id="uniqueSearchInput"
          placeholder="کد ملی، شماره موبایل، نام کاربری یا ایمیل را وارد کنید تا فقط همان شخص نمایش داده شود..."
          oninput="renderMembersTable()"
        />

        <div id="advancedSearchBox" class="adv-box">
          <div class="grid-2">
            <div class="field-wrap">
              <label for="advProvince">استان</label>
              <select id="advProvince" onchange="populateCitySelect('advProvince', 'advCity'); renderMembersTable();"></select>
            </div>
            <div class="field-wrap">
              <label for="advCity">شهر</label>
              <select id="advCity" onchange="renderMembersTable()"></select>
            </div>
          </div>
          <div class="grid-2" style="margin-top:8px;">
            <div class="field-wrap">
              <label for="advFirstName">نام</label>
              <input id="advFirstName" placeholder="جستجو بر اساس نام..." oninput="renderMembersTable()" />
            </div>
            <div class="field-wrap">
              <label for="advLastName">نام خانوادگی</label>
              <input id="advLastName" placeholder="جستجو بر اساس نام خانوادگی..." oninput="renderMembersTable()" />
            </div>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ردیف</th>
              <th>نام کاربری</th>
              <th>ایمیل</th>
              <th>نام</th>
              <th>نام خانوادگی</th>
              <th>کد ملی</th>
              <th>شماره موبایل</th>

              <th>کد پستی</th>
              <th>رمز عبور</th>
              <th>تاریخ ثبت</th>
            </tr>
          </thead>
          <tbody id="membersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

    function populateProvinceSelect(provinceSelectId, citySelectId) {
      const provEl = document.getElementById(provinceSelectId);
      if (!provEl) return;
      const provinces = Object.keys(IRAN_PROVINCES_CITIES).sort((a, b) => a.localeCompare(b, "fa"));
      provEl.innerHTML = `<option value="">همه استان‌ها</option>` + provinces.map(p => `<option value="${p}">${p}</option>`).join("");
      populateCitySelect(provinceSelectId, citySelectId);
    }

    function populateCitySelect(provinceSelectId, citySelectId) {
      const provEl = document.getElementById(provinceSelectId);
      const cityEl = document.getElementById(citySelectId);
      if (!provEl || !cityEl) return;
      const prov = provEl.value;
      const cities = prov && IRAN_PROVINCES_CITIES[prov] ? [...IRAN_PROVINCES_CITIES[prov]].sort((a, b) => a.localeCompare(b, "fa")) : [];
      cityEl.innerHTML = `<option value="">${prov ? "همه شهرهای این استان" : "ابتدا استان را انتخاب کنید"}</option>` + cities.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function loadRegisteredMembers() {
      const merged = [];
      const seen = new Set();
      [PRIMARY_USERS_KEY, FALLBACK_USERS_KEY].forEach(key => {
        try {
          const list = JSON.parse(localStorage.getItem(key) || "[]");
          if (Array.isArray(list)) {
            list.forEach(item => {
              const marker = `${item.national_id || ""}|${item.phone || ""}|${item.username || ""}|${item.created_at || ""}`;
              if (!seen.has(marker)) {
                seen.add(marker);
                merged.push(item);
              }
            });
          }
        } catch (_) {}
      });
      return merged;
    }

    function toggleAdvancedSearch() {
      const box = document.getElementById("advancedSearchBox");
      if (!box) return;
      box.classList.toggle("open");
      if (box.classList.contains("open") && !document.getElementById("advProvince").options.length) {
        populateProvinceSelect("advProvince", "advCity");
      }
    }

    function resetFilters() {
      document.getElementById("uniqueSearchInput").value = "";
      const pEl = document.getElementById("advProvince");
      const cEl = document.getElementById("advCity");
      const fEl = document.getElementById("advFirstName");
      const lEl = document.getElementById("advLastName");
      if (pEl) pEl.value = "";
      if (cEl) cEl.innerHTML = '<option value="">ابتدا استان را انتخاب کنید</option>';
      if (fEl) fEl.value = "";
      if (lEl) lEl.value = "";
      renderMembersTable();
    }

    function renderMembersTable() {
      const allMembers = loadRegisteredMembers();
      const badge = document.getElementById("totalBadge");
      if (badge) badge.textContent = allMembers.length;

      const uniqueQuery = (document.getElementById("uniqueSearchInput")?.value || "").trim().toLowerCase();
      const advProv = (document.getElementById("advProvince")?.value || "").trim();
      const advCity = (document.getElementById("advCity")?.value || "").trim();
      const advFirst = (document.getElementById("advFirstName")?.value || "").trim().toLowerCase();
      const advLast = (document.getElementById("advLastName")?.value || "").trim().toLowerCase();

      let filtered = allMembers;

      if (uniqueQuery) {
        const exactMatches = filtered.filter(m =>
          String(m.national_id || "").toLowerCase() === uniqueQuery ||
          String(m.phone || "").toLowerCase() === uniqueQuery ||
          String(m.username || "").toLowerCase() === uniqueQuery ||
          String(m.email || "").toLowerCase() === uniqueQuery
        );
        filtered = exactMatches.length ? exactMatches : filtered.filter(m =>
          String(m.national_id || "").toLowerCase().includes(uniqueQuery) ||
          String(m.phone || "").toLowerCase().includes(uniqueQuery) ||
          String(m.username || "").toLowerCase().includes(uniqueQuery) ||
          String(m.email || "").toLowerCase().includes(uniqueQuery)
        );
      }

      if (advProv) {
        filtered = filtered.filter(m => (m.province || "") === advProv);
      }
      if (advCity) {
        filtered = filtered.filter(m => (m.city || "") === advCity);
      }
      if (advFirst) {
        filtered = filtered.filter(m => String(m.first_name || "").toLowerCase().includes(advFirst));
      }
      if (advLast) {
        filtered = filtered.filter(m => String(m.last_name || "").toLowerCase().includes(advLast));
      }

      const tbody = document.getElementById("membersTableBody");
      if (!tbody) return;

      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="17" style="text-align:center; padding:18px; color:#6b7280;">هیچ عضوی با این مشخصات یافت نشد.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map((m, idx) => `
        <tr>
          <td>${idx + 1}</td>
          <td>${m.username || "-"}</td>
          <td>${m.email || "-"}</td>
          <td>${m.first_name || "-"}</td>
          <td>${m.last_name || "-"}</td>
          <td><strong>${m.national_id || "-"}</strong></td>
          <td><strong>${m.phone || "-"}</strong></td>
          <td>${m.province || "-"}</td>
          <td>${m.city || "-"}</td>
          <td>${m.street || "-"}</td>
          <td>${m.alley || "-"}</td>
          <td>${m.plaque || "-"}</td>
          <td>${m.floor || "-"}</td>
          <td>${m.unit || "-"}</td>
          <td>${m.postal_code || "-"}</td>
          <td>${m.password || "-"}</td>
          <td>${m.created_at ? new Date(m.created_at).toLocaleString("fa-IR") : "-"}</td>
        </tr>
      `).join("");
    }

    renderMembersTable();
  </script>
