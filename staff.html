<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت سفارش‌ها | بوم چاش</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #f4f6f5;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1, h2 { margin-top: 0; }
    .login-box { max-width: 380px; margin: 40px auto; }
    input, button {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      box-sizing: border-box;
    }
    button {
      background: #15803d;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #166534; }
    .btn-secondary {
      background: #475569;
      width: auto;
      padding: 8px 14px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: right;
      vertical-align: top;
    }
    th { background: #f1f5f9; }
    .badge-pending {
      background: #fef3c7;
      color: #92400e;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-block;
    }
    .badge-done {
      background: #dcfce7;
      color: #166534;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-block;
    }
    .error { color: #dc2626; font-size: 13px; margin-top: 6px; }
    .hidden { display: none; }
    .btn-confirm-lock {
      background: #0f766e;
      color: #fff;
      width: auto;
      padding: 6px 10px;
      margin: 6px 0 0;
      font-size: 12px;
      border-radius: 6px;
      display: inline-block;
    }
    .btn-confirm-lock:hover:not(:disabled) { background: #115e59; }
    .btn-confirm-lock:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      opacity: 0.85;
    }
    .locked-note {
      display: block;
      font-size: 11px;
      color: #166534;
      font-weight: bold;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginSection" class="login-box">
      <h2>ورود اپراتور سفارش‌ها</h2>
      <p>ایمیل و رمز عبور اختصاصی خود را وارد کنید.</p>
      <form id="loginForm">
        <input type="email" id="emailInput" placeholder="ایمیل اپراتور" required />
        <input type="password" id="passwordInput" placeholder="رمز عبور" required />
        <button type="submit">ورود به پنل</button>
      </form>
      <div id="loginError" class="error"></div>
    </div>

    <div id="panelSection" class="hidden">
      <div class="top-bar">
        <div>
          <h2>مدیریت سفارش‌های بوم چاش</h2>
          <small id="operatorInfo"></small>
        </div>
        <div>
          <button id="refreshBtn" class="btn-secondary" type="button">به‌روزرسانی لیست</button>
          <button id="logoutBtn" class="btn-secondary" type="button">خروج</button>
        </div>
      </div>

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>تایید پردازش سفارش</th>
              <th>نام مشتری</th>
              <th>تلفن</th>
              <th>آدرس</th>
              <th>اقلام</th>
              <th>مبلغ کل</th>
              <th>وضعیت سفارش</th>
              <th>اپراتور و زمان پردازش سفارش</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="panelError" class="error"></div>
    </div>
  </div>

  <script>
   const SUPABASE_URL = "https://zfetolyexhfftjejswtt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_50vAaVZHEsTpiWt0J5MTCw_hK9hgklL";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById("loginSection");
    const panelSection = document.getElementById("panelSection");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const panelError = document.getElementById("panelError");
    const operatorInfo = document.getElementById("operatorInfo");
    const ordersBody = document.getElementById("ordersBody");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    let currentUser = null;

    function formatItems(items) {
      if (!items) return "-";
      if (Array.isArray(items)) {
        return items.map(it => `${it.name \vert{}\vert{} it.title \vert{}\vert{} "محصول"} × ${it.qty || it.quantity || 1}`).join("<br>");
      }
      if (typeof items === "string") {
        try {
          const parsed = JSON.parse(items);
          if (Array.isArray(parsed)) {
            return parsed.map(it => `${it.name \vert{}\vert{} it.title \vert{}\vert{} "محصول"} × ${it.qty || it.quantity || 1}`).join("<br>");
          }
        } catch (_) {}
        return items;
      }
      return JSON.stringify(items);
    }

    function formatDate(isoStr) {
      if (!isoStr) return "";
      try {
        return new Date(isoStr).toLocaleString("fa-IR");
      } catch (_) {
        return isoStr;
      }
    }

    async function loadOrders() {
      panelError.textContent = "";
      ordersBody.innerHTML = `<tr><td colspan="8">در حال بارگذاری سفارش‌ها...</td></tr>`;

      const { data, error } = await sb
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        ordersBody.innerHTML = "";
        panelError.textContent = "خطا در دریافت سفارش‌ها: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        ordersBody.innerHTML = `<tr><td colspan="8">هیچ سفارشی ثبت نشده است.</td></tr>`;
        return;
      }

      ordersBody.innerHTML = data.map(order => {
        const isDone = Boolean(order.processed_at || order.processed_by);
        const statusBadge = isDone
          ? `<span class="badge-done">پردازش شد</span>`
          : `<span class="badge-pending">در انتظار</span>`;

        const metaText = isDone
          ? `${order.processed_by \vert{}\vert{} "اپراتور"}<br><small>${formatDate(order
