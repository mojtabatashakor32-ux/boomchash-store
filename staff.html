<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت سفارش‌ها | اورگانو</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: #f4f6f5;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1, h2 { margin-top: 0; }
    .login-box { max-width: 380px; margin: 40px auto; }
    input, button {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      box-sizing: border-box;
    }
    button {
      background: #15803d;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #166534; }
    .btn-secondary {
      background: #475569;
      width: auto;
      padding: 8px 14px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 10px;
      text-align: right;
      vertical-align: top;
    }
    th { background: #f1f5f9; }
    .badge-pending {
      background: #fef3c7;
      color: #92400e;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-block;
    }
    .badge-done {
      background: #dcfce7;
      color: #166534;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      display: inline-block;
    }
    .error { color: #dc2626; font-size: 13px; margin-top: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loginSection" class="login-box">
      <h2>ورود اپراتور سفارش‌ها</h2>
      <p>ایمیل و رمز عبور اختصاصی خود را وارد کنید.</p>
      <form id="loginForm">
        <input type="email" id="emailInput" placeholder="ایمیل اپراتور" required />
        <input type="password" id="passwordInput" placeholder="رمز عبور" required />
        <button type="submit">ورود به پنل</button>
      </form>
      <div id="loginError" class="error"></div>
    </div>

    <div id="panelSection" class="hidden">
      <div class="top-bar">
        <div>
          <h2>مدیریت سفارش‌های اورگانو</h2>
          <small id="operatorInfo"></small>
        </div>
        <div>
          <button id="refreshBtn" class="btn-secondary" type="button">به‌روزرسانی لیست</button>
          <button id="logoutBtn" class="btn-secondary" type="button">خروج</button>
        </div>
      </div>

      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>پردازش شد</th>
              <th>مشتری</th>
              <th>تلفن</th>
              <th>آدرس</th>
              <th>اقلام</th>
              <th>مبلغ کل</th>
              <th>وضعیت</th>
              <th>اپراتور و زمان</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="panelError" class="error"></div>
    </div>
  </div>

  <script>
      const SUPABASE_URL = "https://zfetolyexhfftjejswtt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_50vaAVZHEsTPiWt0J5MTCw_hk9hgk1L";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById("loginSection");
    const panelSection = document.getElementById("panelSection");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const panelError = document.getElementById("panelError");
    const operatorInfo = document.getElementById("operatorInfo");
    const ordersBody = document.getElementById("ordersBody");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    let currentUser = null;

    function formatItems(items) {
      if (!items) return "-";
      if (Array.isArray(items)) {
        return items.map(it => ${it.name || it.title || "محصول"} × ${it.qty || it.quantity || 1}).join("<br>");
      }
      if (typeof items === "string") {
        try {
          const parsed = JSON.parse(items);
          if (Array.isArray(parsed)) {
            return parsed.map(it => ${it.name || it.title || "محصول"} × ${it.qty || it.quantity || 1}).join("<br>");
          }
        } catch (_) {}
        return items;
      }
      return JSON.stringify(items);
    }

    function formatDate(isoStr) {
      if (!isoStr) return "";
      try {
        return new Date(isoStr).toLocaleString("fa-IR");
      } catch (_) {
        return isoStr;
      }
    }

    async function loadOrders() {
      panelError.textContent = "";
      ordersBody.innerHTML = <tr><td colspan="8">در حال بارگذاری سفارش‌ها...</td></tr>;

      const { data, error } = await sb
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        ordersBody.innerHTML = "";
        panelError.textContent = "خطا در دریافت سفارش‌ها: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        ordersBody.innerHTML = <tr><td colspan="8">هیچ سفارشی ثبت نشده است.</td></tr>;
        return;
      }

      ordersBody.innerHTML = data.map(order => {
        const isDone = Boolean(order.processed_at || order.processed_by);
        const statusBadge = isDone
          ? <span class="badge-done">پردازش شد</span>
          : <span class="badge-pending">در انتظار</span>;

        const metaText = isDone
          ? ${order.processed_by || "اپراتور"}<br><small>${formatDate(order.processed_at)}</small>
          : "-";

        const customerName = orde order.full_name der.full_name || order.name || "-";
        const phon order.mobile  order.mobile || "-";
        const address = order.address || "-";
        const total = order.total_price ?? order.total ?? "-";

        return 
          <tr>
            <td style="text-align:center;">
              <input
                type="checkbox"
                ${isDone ? "checked" : ""}
                onchange="toggleProcessed('${order.id}', this.checked, this)"
              />
            </td>
            <td>${customerName}</td>
            <td>${phone}</td>
            <td>${address}</td>
            <td>${formatItems(order.items)}</td>
            <td>${total}</td>
            <td>${statusBadge}</td>
            <td>${metaText}</td>
          </tr>
        ;
      }).join("");
    }

    window.toggleProcessed = async function(orderId, checked, checkboxEl) {
      panelError.textContent = "";
      checkboxEl.disabled = true;

      const updatePayload = checked
        ? {
            processed_by: currentUser?.email || "operator",
            processed_at: new Date().toISOString()
          }
        : {
            processed_by: null,
            processed_at: null
          };

      const { error } = await sb
        .from("orders")
        .update(updatePayload)
        .eq("id", orderId);

      checkboxEl.disabled = false;if (error) {
        checkboxEl.checked = !checked;
        panelError.textContent = "خطا در ثبت وضعیت پردازش: " + error.message;
        return;
      }

      await loadOrders();
    };

    function showPanel(user) {
      currentUser = user;
      loginSection.classList.add("hidden");
      panelSection.classList.remove("hidden");
      operatorInfo.textContent = اپراتور واردشده: ${user.email};
      loadOrders();
    }

    function showLogin() {
      currentUser = null;
      panelSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = "ورود ناموفق بود: " + error.message;
        return;
      }
      if (data.user) {
        showPanel(data.user);
      }
    });

    refreshBtn.addEventListener("click", loadOrders);

    logoutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      showLogin();
    });

    sb.auth.getSession().then(({ data }) => {
      if (data.session && data.session.user) {
        showPanel(data.session.user);
      } else {
        showLogin();
      }
    });
  </script>
</body>
</html>
